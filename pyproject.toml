[project]
name = "simulator-physics"
version = "0.1.0"
description = "Cross-engine physics comparison: MuJoCo 3.11 vs 4.0, MuJoCo-Warp, Newton, Genesis"
requires-python = "==3.12.*"
dependencies = ["simbench"]

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8"]

[tool.uv.sources]
simbench = { path = "packages/simbench", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["packages/simbench/tests"]
