[project]
name = "route-genesis"
version = "0.1.0"
description = "Genesis rigid solver on GPU, float64"
requires-python = "==3.12.*"
dependencies = ["simbench", "genesis-world==1.4.5", "mujoco==4.0.0", "torch==2.14.1"]

[tool.uv]
package = false

[tool.uv.sources]
simbench = { path = "../../packages/simbench", editable = true }
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
