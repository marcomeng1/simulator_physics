[project]
name = "route-newton"
version = "0.1.0"
description = "Newton with its MuJoCo-Warp solver on GPU, float32 (MuJoCo-Warp version as pinned by Newton)"
requires-python = "==3.12.*"
dependencies = ["simbench", "newton[sim,importers]==1.7.0", "warp-lang==1.19.0"]

[tool.uv]
package = false

[tool.uv.sources]
simbench = { path = "../../packages/simbench", editable = true }
