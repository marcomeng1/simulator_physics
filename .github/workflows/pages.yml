# Deploys web/ to GitHub Pages. The simulation data cannot be regenerated in CI (it needs
# the GPU runs), so it comes from the `site-data` release, uploaded by `make publish-data`.
name: Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch site data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view site-data >/dev/null 2>&1; then
            echo "::error::No 'site-data' release yet. Run 'make publish-data' locally, or create a release tagged site-data with dist/site-data.tar.gz attached."
            exit 1
          fi
          gh release download site-data --pattern site-data.tar.gz --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/site-data.tar.gz" -C web
          test -f web/data/index.json
          du -sh web/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
