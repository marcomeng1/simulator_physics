[project]
name = "simbench"
version = "0.1.0"
description = "Engine-agnostic scenes, controller, traces and metrics for the cross-engine benchmark"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.scripts]
simbench = "simbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simbench"]
